<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
            font-size: 14px;
        }

        form {
            width: 500px;
        }

        input,
        select,
        textarea {
            margin-bottom: 10px;
        }

        label {
            display: block;
        }

        .opcao label {
            display: inline;
        }

        fieldset {
            border: none;
            border-top: 1px solid #999;
            padding-top: 10px;
            margin-top: 5px;
        }

        legend {
            padding-right: 10px;
        }

        textarea {
            width: 300px;
            height: 60px;
        }
    </style>
</head>

<body>

<form>

    <!-- Informações pessoais -->

    <label for="nome">Nome Completo:</label>
    <input
        type="text"
        id="nome"
        name="nome"
        placeholder="Ex: João da Silva"
    >

    <label for="email">E-mail:</label>
    <input
        type="email"
        id="email"
        name="email"
        placeholder="exemplo@dominio.com"
    >

    <label for="senha">Senha:</label>
    <input
        type="password"
        id="senha"
        name="senha"
        minlength="8"
        placeholder="Mínimo 8 caracteres"
    >

    <label for="nascimento">Data de Nascimento:</label>
    <input
        type="date"
        id="nascimento"
        name="nascimento"
    >

    <label for="telefone">Telefone / Celular:</label>
    <input
        type="tel"
        id="telefone"
        name="telefone"
        placeholder="86 99999-9999"
    >
    <small>(Formato: DD 99999-9999)</small>


    <!-- Preferências -->

    <fieldset>

        <legend>Preferências e Conhecimentos</legend>

        <label for="experiencia">
            Nível de Experiência Geral (1 a 5):
        </label>

        <input
            type="range"
            id="experiencia"
            name="experiencia"
            min="1"
            max="5"
            value="3"
        >


        <label for="escolaridade">
            Grau de Escolaridade:
        </label>

        <select id="escolaridade" name="escolaridade">
            <option value="">Selecione uma opção...</option>
            <option value="fundamental">Ensino Fundamental</option>
            <option value="medio">Ensino Médio</option>
            <option value="tecnico">Ensino Técnico</option>
            <option value="superior">Ensino Superior</option>
            <option value="pos">Pós-graduação</option>
            <option value="mestrado">Mestrado</option>
            <option value="doutorado">Doutorado</option>
        </select>


        <p>Áreas de Interesse:</p>

        <div class="opcao">
            <input
                type="checkbox"
                id="frontend"
                name="interesses"
                value="frontend"
            >
            <label for="frontend">Front-end</label>
        </div>

        <div class="opcao">
            <input
                type="checkbox"
                id="backend"
                name="interesses"
                value="backend"
            >
            <label for="backend">Back-end</label>
        </div>

        <div class="opcao">
            <input
                type="checkbox"
                id="iot"
                name="interesses"
                value="iot"
            >
            <label for="iot">IoT e Sistemas Embarcados</label>
        </div>

        <div class="opcao">
            <input
                type="checkbox"
                id="dados"
                name="interesses"
                value="banco-dados"
            >
            <label for="dados">Banco de Dados</label>
        </div>


        <p>Frequência de E-mails/Notificações:</p>

        <div class="opcao">
            <input
                type="radio"
                id="diaria"
                name="frequencia"
                value="diaria"
                checked
            >
            <label for="diaria">Diária</label>
        </div>

        <div class="opcao">
            <input
                type="radio"
                id="semanal"
                name="frequencia"
                value="semanal"
            >
            <label for="semanal">Semanal</label>
        </div>

        <div class="opcao">
            <input
                type="radio"
                id="nao-receber"
                name="frequencia"
                value="nao-receber"
            >
            <label for="nao-receber">Não receber</label>
        </div>

    </fieldset>


    <!-- Documentação -->

    <fieldset>

        <legend>Documentação</legend>

        <label for="foto">Foto de Perfil:</label>

        <input
            type="file"
            id="foto"
            name="foto"
            accept="image/*"
        >


        <label for="biografia">
            Breve Biografia / Apresentação:
        </label>

        <textarea
            id="biografia"
            name="biografia"
            placeholder="Conte um pouco sobre seus projetos..."
        ></textarea>

    </fieldset>


    <!-- Finalização -->

    <fieldset>

        <legend>Finalização</legend>

        <div class="opcao">

            <input
                type="checkbox"
                id="termos"
                name="termos"
                required
            >

            <label for="termos">
                Declaro que li e concordo com os termos e condições.
            </label>

        </div>

        <br>

        <button type="submit">
            Enviar Cadastro
        </button>

        <button type="reset">
            Limpar Campos
        </button>

    </fieldset>

</form>

</body>
</html>
